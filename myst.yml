# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: c76d1b0d-663b-4106-8bc4-c7926e2040b4
  title: Matemáticas Aplicadas III
  description: "Material interactivo y reproducible para el curso Matemáticas Aplicadas III de la Universidad Icesi."
  keywords:
    - matematicas
    - aplicadas
    - jupyter-book
    - modelacion
    - python
    - docencia
  authors:
    - name: Angela Villota
    - name: Aníbal Sosa
  # Template repository. When creating a course from this template,
  # change this URL to the new course repository.
  github: https://github.com/Icesi-MA/Matematicas-Aplicadas-III
  jupyter:
    binder:
      # Template Binder repository. When creating a course from this template,
      # change this value to "owner/repository" for the new course.
      repo: Icesi-MA/Matematicas-Aplicadas-III
      ref: main

  settings:
    output_matplotlib_strings: remove

  toc:
    - file: README.md
    - title: "Unidad 1: Integración en varias variables"
      children:
        - file: Notebooks/Nb0_introduccion_integrales_dobles_rectangulos.ipynb
        - file: Entregas/MA_III-Entrega1.ipynb
        - file: Notebooks/Nb1_integrales_dobles_regiones_generales.ipynb
        - file: Entregas/MA_III-Entrega2.ipynb
        - file: Notebooks/Nb2_integrales_triples_y_mapeos_geometricos.ipynb
        - file: Entregas/MA_III-Entrega3.ipynb
        - file: Jornadas/MA_III-1raJRP-2026.ipynb
    - title: "Unidad 2: Subespacios en espacios de dimensión finita"
      children:
        - file: Notebooks/Nb3_independencia_lineal_y_subespacios_fundamentales.ipynb
        - file: Entregas/MA_III-Entrega4.ipynb
        - file: Notebooks/Nb4_vectores_y_conjuntos_ortogonales.ipynb
        - file: Entregas/MA_III-Entrega5.ipynb
        - file: Notebooks/Nb5_sistemas_lineales_y_matrices.ipynb
        - file: Entregas/MA_III-Entrega6.ipynb
        - file: Jornadas/MA_III-2daJRP.ipynb
        - file: Jornadas/MA_III-2daJRP-2026-1.ipynb
    - title: "Unidad 3: Mínimos cuadrados"
      children:
        - file: Notebooks/Nb6_minimos_cuadrados_y_proyecciones.ipynb
        - file: Entregas/MA_III-Entrega7.ipynb
        - file: Notebooks/Nb7_ajuste_de_datos_minimos_cuadrados.ipynb
        - file: Entregas/MA_III-Entrega8.ipynb
        - file: Notebooks/Nb8_valores_y_vectores_propios_y_diagonalizacion.ipynb
        - file: Entregas/MA_III-Entrega9.ipynb
        - file: Notebooks/Nb9_diagonalizacion_ortogonal_y_svd.ipynb
        - file: Jornadas/MA_III-3raJRP-2023-II.ipynb
        - file: Jornadas/MA_III-3raJRP.ipynb

 
site:
